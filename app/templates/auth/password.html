{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:440px;margin:30px auto">
  <h2>비밀번호 변경</h2>
  {% if current_user.must_change_password %}<div class="notice">처음 로그인했거나 비밀번호가 초기화되었습니다. 새 비밀번호를 설정해야 계속할 수 있습니다.</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label>현재 비밀번호</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label>새 비밀번호 (4자 이상, 학번과 다르게)</label><input type="password" name="new" required autocomplete="new-password"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" name="confirm" required autocomplete="new-password"></div>
    <button class="btn primary">변경하기</button>
  </form>
</div>
{% endblock %}
